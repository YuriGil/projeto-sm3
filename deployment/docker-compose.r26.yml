services:
  sm3-r26-acquisition:
    build:
      context: ../r26_acquisition
      dockerfile: Dockerfile
    container_name: sm3-r26-acquisition
    restart: unless-stopped
    environment:
      - SM3_PROJECT_ROOT=/project
      - SM3_R26_PORT=8093
      - SM3_R25_URL=http://sm3-r25-relay:8092/ingest
    volumes:
      - ../:/project
    expose:
      - "8093"
    depends_on:
      sm3-r25-relay:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,json; x=json.load(urllib.request.urlopen('http://127.0.0.1:8093/health',timeout=3)); assert x['ok']"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
