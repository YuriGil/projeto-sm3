services:
  sm3-r30-editorial-context-injection:
    build:
      context: ../r30_1_injection
      dockerfile: Dockerfile
    container_name: sm3-r30-editorial-context-injection
    restart: unless-stopped
    environment:
      - SM3_PROJECT_ROOT=/project
      - SM3_R30_1_INTERVAL_SECONDS=900
      - SM3_WORKER_OPENAPI=http://media-worker:8090/openapi.json
    volumes:
      - ../:/project
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,os; p='/project/state/preedit_strategy/SM3_EDITORIAL_CONTEXT_INJECTION_HEALTH.json'; assert os.path.isfile(p); x=json.load(open(p,'r',encoding='utf-8-sig')); assert x.get('ok') is True"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
