services:
  sm3-r29-drift-detector:
    build:
      context: ../r29_drift
      dockerfile: Dockerfile
    container_name: sm3-r29-drift-detector
    restart: unless-stopped
    environment:
      - SM3_PROJECT_ROOT=/project
      - SM3_R29_2_INTERVAL_SECONDS=900
    volumes:
      - ../:/project
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,os; p='/project/state/social_observer/SM3_PLATFORM_AUDIENCE_DRIFT_HEALTH.json'; assert os.path.isfile(p); x=json.load(open(p,'r',encoding='utf-8-sig')); assert x.get('ok') is True"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
